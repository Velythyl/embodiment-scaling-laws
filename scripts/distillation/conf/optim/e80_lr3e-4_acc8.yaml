optimizer: adamw  # adamw or lamb
lr: 0.0003
num_epochs: 80
# BUG: gradient_acc_steps > 1 does NOT divide loss by gradient_acc_steps before .backward().
# This means the effective LR is actually lr * gradient_acc_steps (e.g. 0.0003 * 8 = 0.0024).
# A batch_size=64 with gradient_acc_steps=8 is NOT equivalent to batch_size=512 with acc=1;
# it behaves like batch_size=512 with acc=1 and lr scaled up 8x.
gradient_acc_steps: 8
warmup_pct: 0.0
use_amp: false
checkpoint_interval: 5
log_epoch_pct: 2.0
eval_epoch_pct: 25.0
